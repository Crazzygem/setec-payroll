{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Payroll KH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Jakarta Sans', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1, h2, h3, .brand { font-family: 'Sora', sans-serif; }
    .login-card {
      width: 380px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 1rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      padding: 2rem;
    }
    .brand-badge {
      width: 48px; height: 48px;
      border-radius: 0.75rem;
      background: #eef2ff;
      color: #4f46e5;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      margin: 0 auto 0.75rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-badge"><i class="bi bi-wallet2"></i></div>
    <h3 class="text-center mb-1" style="font-weight:700">Payroll KH</h3>
    <p class="text-center text-muted small mb-4">Payroll Management System</p>

    {% if form.errors %}
      <div class="alert alert-danger py-2 small">Invalid username or password.</div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold" for="id_username">Username</label>
        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold" for="id_password">Password</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-accent w-100" style="background:#4f46e5;color:#fff">Sign in</button>
    </form>
  </div>
</body>
</html>
