{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Payroll KH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1, h2, h3, .brand { font-family: 'IBM Plex Sans', sans-serif; }
    .login-card {
      width: min(380px, calc(100vw - 2rem));
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 1rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      padding: 2rem;
    }
    .brand-badge {
      width: 48px; height: 48px;
      border-radius: 0.75rem;
      background: #ecfdf5;
      color: #059669;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      margin: 0 auto 0.75rem;
    }
    .btn-accent { background: #047857; color: #fff; }
    .btn-accent:hover { background: #065f46; color: #fff; }
    .form-control:focus { border-color: #047857; box-shadow: none; outline: 2px solid #047857; outline-offset: 1px; }
    a:focus-visible, button:focus-visible, .btn:focus-visible {
      outline: 2px solid #047857; outline-offset: 2px; box-shadow: none;
    }
    @media (pointer: coarse) {
      .btn { min-height: 44px; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-badge"><i class="bi bi-wallet2"></i></div>
    <h1 class="h3 text-center mb-1" style="font-weight:700">Payroll KH</h1>
    <p class="text-center text-muted small mb-4">Sign in to run payroll, payslips and GDT filings.</p>

    {% if form.errors %}
      <div class="alert alert-danger py-2 small" role="alert" id="login-error">
        <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        Username or password is incorrect. Both are case-sensitive.</div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold" for="id_username">Username</label>
        <input type="text" name="username" id="id_username" class="form-control{% if form.errors %} is-invalid{% endif %}"
               value="{{ form.username.value|default_if_none:'' }}" autocomplete="username"
               autocapitalize="none" spellcheck="false" autofocus required
               {% if form.errors %}aria-describedby="login-error"{% endif %}>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold" for="id_password">Password</label>
        <div class="input-group">
          <input type="password" name="password" id="id_password" class="form-control{% if form.errors %} is-invalid{% endif %}"
                 autocomplete="current-password" required
                 {% if form.errors %}aria-describedby="login-error"{% endif %}>
          <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                  aria-controls="id_password" aria-pressed="false">Show</button>
        </div>
      </div>
      <button type="submit" class="btn btn-accent w-100">Sign in</button>
    </form>
    <script>
      (function () {
        var btn = document.getElementById('togglePassword');
        var input = document.getElementById('id_password');
        btn.addEventListener('click', function () {
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          btn.textContent = show ? 'Hide' : 'Show';
          btn.setAttribute('aria-pressed', show ? 'true' : 'false');
          input.focus();
        });
      })();
    </script>
  </div>
</body>
</html>
